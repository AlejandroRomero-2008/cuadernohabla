<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi cuaderno habla</title>
<style>
  :root{
    --fondo:#F4F6EF;
    --tinta:#183B3A;
    --teal:#23847D;
    --coral:#E47C58;
    --mostaza:#D5A52D;
    --azul:#5278A4;
    --verde:#6B936B;
    --vino:#B25F76;
    --borde:#E0E6DD;
    --gris:#425956;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--fondo);
    color:var(--tinta);
    line-height:1.5;
  }
  header.encabezado{
    background:var(--tinta);
    color:#fff;
    padding:20px 16px 24px;
  }
  header.encabezado h1{
    margin:0;
    font-size:1.7rem;
  }
  .contenedor{
    max-width:820px;
    margin:0 auto;
    padding:16px;
  }
  details.config{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:16px;
  }
  details.config summary{
    cursor:pointer;
    font-weight:600;
  }
  .fila-clave{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  input[type=password],input[type=text]{
    flex:1;
    min-width:200px;
    padding:10px;
    border:1px solid var(--borde);
    border-radius:8px;
    font-size:1rem;
  }
  button{
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:11px 18px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.07);}
  button:disabled{opacity:.5;cursor:not-allowed;}
  button.secundario{background:var(--azul);}
  button.coral{background:var(--coral);}
  button.plano{background:#eef2ea;color:var(--tinta);}
  .tabs{
    display:flex;
    gap:8px;
    margin:14px 0;
  }
  .tab{
    flex:1;
    background:#eef2ea;
    color:var(--tinta);
    border:1px solid var(--borde);
    border-radius:10px;
    padding:12px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .tab.activo{background:var(--teal);color:#fff;border-color:var(--teal);}
  .panel{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:16px;
  }
  .oculto{display:none !important;}
  .aviso{
    border-radius:10px;
    padding:12px 14px;
    margin:12px 0;
    font-size:.95rem;
  }
  .aviso.error{background:#fdecea;color:#a4262c;border:1px solid #f3c2be;}
  .aviso.info{background:#eaf4f2;color:#1d655f;border:1px solid #bfe0da;}
  .aviso.ok{background:#e8f5e9;color:#1e6b34;border:1px solid #c3e6c8;}
  .aviso.warn{background:#fdf6e3;color:#8a6d19;border:1px solid #f0dfa8;}
  section.bloque{margin-top:22px;}
  section.bloque h2{
    font-size:1.25rem;
    border-bottom:2px solid var(--borde);
    padding-bottom:6px;
    margin-bottom:12px;
  }
  .materia{color:var(--gris);font-weight:600;margin-top:-6px;}
  .dificultad{font-size:1.1rem;letter-spacing:2px;}
  ul.conceptos{list-style:none;padding:0;margin:0;}
  ul.conceptos li{
    background:#fff;
    border:1px solid var(--borde);
    border-left:5px solid var(--teal);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  ul.conceptos li strong{color:var(--teal);}
  details.tarjeta{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  details.tarjeta summary{cursor:pointer;font-weight:600;}
  details.tarjeta .resp{margin-top:8px;color:var(--gris);}
  .pregunta{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
  }
  .pregunta p.enunciado{font-weight:600;margin:0 0 10px;}
  .opcion{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:8px 10px;
    border:1px solid var(--borde);
    border-radius:8px;
    margin-bottom:6px;
    cursor:pointer;
  }
  .opcion:hover{background:#f7faf6;}
  .opcion input{margin-top:4px;}
  .veredicto{font-weight:600;margin-top:8px;padding:8px 10px;border-radius:8px;}
  .veredicto.ok{background:#e8f5e9;color:#1e6b34;}
  .veredicto.mal{background:#fdecea;color:#a4262c;}
  .veredicto.sin{background:#fdf6e3;color:#8a6d19;}
  .puntaje{
    background:var(--tinta);
    color:#fff;
    border-radius:12px;
    padding:16px;
    text-align:center;
    font-size:1.2rem;
    margin:14px 0;
  }
  .puntaje .num{font-size:2rem;font-weight:700;display:block;}
  .acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  canvas.infografia{
    width:100%;
    border-radius:12px;
    border:1px solid var(--borde);
    margin-top:12px;
  }
  .cargando{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--gris);
  }
  .spinner{
    width:18px;height:18px;
    border:3px solid var(--borde);
    border-top-color:var(--teal);
    border-radius:50%;
    animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg);}}
  footer.pie{
    text-align:center;
    color:var(--gris);
    font-size:.85rem;
    padding:24px 16px;
  }
  .confeti{
    position:fixed;
    top:-10px;
    width:10px;height:16px;
    opacity:.9;
    z-index:9999;
    pointer-events:none;
  }
</style>
</head>
<body>
<header class="encabezado">
  <h1>📓 Mi cuaderno habla</h1>
  <div style="font-size:.9rem;opacity:.85">Tomá una foto de tu cuaderno y estudiá con resumen, tarjetas y examen</div>
</header>

<div class="contenedor">
  <details class="config" id="config">
    <summary>⚙️ Configuración: clave de Gemini</summary>
    <p style="font-size:.9rem;color:var(--gris)">
      Pegá tu clave de Gemini (GEMINI_API_KEY). Se guarda solo en este dispositivo.
    </p>
    <div class="fila-clave">
      <input type="password" id="clave" placeholder="Pegá aquí tu clave..." autocomplete="off" />
      <button id="guardarClave" class="plano">Guardar</button>
    </div>
    <div id="estadoClave" class="aviso info oculto"></div>
  </details>

  <div class="tabs">
    <div class="tab activo" data-tab="foto">📷 Tomar foto</div>
    <div class="tab" data-tab="subir">🖼️ Subir imagen</div>
  </div>

  <div class="panel" id="panelFoto">
    <input type="file" id="inputCamara" accept="image/*" capture="environment" />
    <div style="margin-top:12px">
      <button id="btnAnalizarFoto">Analizar la página</button>
    </div>
  </div>

  <div class="panel oculto" id="panelSubir">
    <input type="file" id="inputArchivo" accept="image/png,image/jpeg,image/webp" />
    <div style="margin-top:12px">
      <button id="btnAnalizarArchivo">Analizar la página</button>
    </div>
  </div>

  <div id="mensajes"></div>
  <div id="resultado"></div>
</div>

<footer class="pie">Versión web · funciona en el navegador del celular</footer>

<script>
/* ============================================================
   CONFIGURACIÓN
   Si querés, pegá tu clave acá para que quede incrustada:
   const CLAVE_INCRUSTADA = "TU_CLAVE";
   ============================================================ */
const CLAVE_INCRUSTADA = "";
const MODELOS = ["gemini-3.5-flash-lite", "gemini-3.6-flash"];
const INTENTOS_POR_MODELO = 2;
const ENDPOINT = "https://generativelanguage.googleapis.com/v1beta/models/";

const INSTRUCCION_SISTEMA =
  "Actuá como un profesor paciente de bachillerato de El Salvador y escribí siempre " +
  "en español salvadoreño claro. Basate únicamente en lo que se ve en la imagen; " +
  "no inventés temas. Si la foto está borrosa, decilo en el resumen en vez de " +
  "inventar contenido. Creá opciones incorrectas de examen creíbles, no absurdas, " +
  "y variá entre preguntas la posición de la respuesta correcta.";

const ESQUEMA_APUNTE = {
  type: "object",
  properties: {
    titulo: { type: "string", description: "Título breve que identifica el tema principal de la página." },
    materia: { type: "string", description: "Nombre de la materia a la que pertenecen los apuntes." },
    resumen: { type: "string", description: "Resumen claro de las ideas principales visibles en la página." },
    conceptos: {
      type: "array",
      description: "Lista de términos importantes con sus explicaciones.",
      items: {
        type: "object",
        properties: {
          termino: { type: "string", description: "Término importante identificado en los apuntes." },
          explicacion: { type: "string", description: "Explicación clara del término." }
        },
        required: ["termino", "explicacion"]
      }
    },
    tarjetas: {
      type: "array",
      description: "Lista de tarjetas de pregunta y respuesta para repasar.",
      items: {
        type: "object",
        properties: {
          pregunta: { type: "string", description: "Pregunta breve para repasar." },
          respuesta: { type: "string", description: "Respuesta correcta y concisa." }
        },
        required: ["pregunta", "respuesta"]
      }
    },
    examen: {
      type: "array",
      description: "Lista de preguntas de opción múltiple.",
      items: {
        type: "object",
        properties: {
          enunciado: { type: "string", description: "Enunciado de una pregunta de opción múltiple." },
          opciones: { type: "array", description: "Lista de 4 opciones de respuesta.", items: { type: "string" } },
          correcta: { type: "integer", description: "Índice (0-3) de la opción correcta." }
        },
        required: ["enunciado", "opciones", "correcta"]
      }
    },
    dificultad: { type: "integer", description: "Nivel de dificultad del contenido (1 a 5)." }
  },
  required: ["titulo", "materia", "resumen", "conceptos", "tarjetas", "examen", "dificultad"]
};

/* ============================================================
   ESTADO
   ============================================================ */
const estado = {
  apunte: null,
  respuestas: {},
  entregado: false,
  audio: null,
  imagenGenerada: false
};

const $ = (sel) => document.querySelector(sel);
const mensajes = $("#mensajes");
const resultado = $("#resultado");

/* ============================================================
   CLAVE
   ============================================================ */
function obtenerClave() {
  if (CLAVE_INCRUSTADA) return CLAVE_INCRUSTADA.trim();
  return (localStorage.getItem("gemini_api_key") || "").trim();
}

function mostrarEstadoClave() {
  const caja = $("#estadoClave");
  const clave = obtenerClave();
  caja.classList.remove("oculto");
  if (clave) {
    caja.className = "aviso ok";
    caja.textContent = "✅ Clave guardada en este dispositivo.";
  } else {
    caja.className = "aviso warn";
    caja.textContent = "⚠️ Todavía no guardaste la clave.";
  }
  $("#clave").value = localStorage.getItem("gemini_api_key") || "";
}

$("#guardarClave").addEventListener("click", () => {
  const valor = $("#clave").value.trim();
  localStorage.setItem("gemini_api_key", valor);
  mostrarEstadoClave();
});
mostrarEstadoClave();

/* ============================================================
   PESTAÑAS
   ============================================================ */
document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("activo"));
    tab.classList.add("activo");
    const esFoto = tab.dataset.tab === "foto";
    $("#panelFoto").classList.toggle("oculto", !esFoto);
    $("#panelSubir").classList.toggle("oculto", esFoto);
  });
});

/* ============================================================
   MENSAJES
   ============================================================ */
function limpiarMensajes() { mensajes.innerHTML = ""; }
function aviso(tipo, texto) {
  const div = document.createElement("div");
  div.className = "aviso " + tipo;
  div.textContent = texto;
  mensajes.appendChild(div);
  return div;
}
function cargando(texto) {
  const div = document.createElement("div");
  div.className = "aviso info cargando";
  div.innerHTML = '<span class="spinner"></span><span>' + texto + "</span>";
  mensajes.appendChild(div);
  return div;
}

/* ============================================================
   LLAMADA A GEMINI
   ============================================================ */
async function llamarGemini(base64, mime) {
  const clave = obtenerClave();
  if (!clave) {
    throw new Error("Falta la clave de Gemini. Abrí ⚙️ Configuración y pegala.");
  }
  const cuerpo = {
    systemInstruction: { parts: [{ text: INSTRUCCION_SISTEMA }] },
    contents: [{
      role: "user",
      parts: [
        { inlineData: { mimeType: mime, data: base64 } },
        { text: "Analizá esta página y prepará el apunte solicitado." }
      ]
    }],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: ESQUEMA_APUNTE,
      temperature: 0.4
    }
  };

  let ultimoError = null;
  for (const modelo of MODELOS) {
    for (let intento = 0; intento < INTENTOS_POR_MODELO; intento++) {
      let resp;
      try {
        resp = await fetch(
          ENDPOINT + encodeURIComponent(modelo) + ":generateContent?key=" + encodeURIComponent(clave),
          { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) }
        );
      } catch (e) {
        ultimoError = e;
        await dormir(1000);
        continue;
      }
      if (resp.status >= 500 && resp.status <= 504) {
        ultimoError = new Error("Gemini respondió " + resp.status);
        await dormir(1000);
        continue;
      }
      if (!resp.ok) {
        const detalle = await resp.text();
        throw new Error("Gemini respondió " + resp.status + ": " + detalle.slice(0, 300));
      }
      const datos = await resp.json();
      const texto = extraerTexto(datos);
      if (!texto) throw new Error("Gemini no devolvió contenido.");
      return JSON.parse(texto);
    }
  }
  const err = new Error("Gemini no está disponible por el momento. Esperá un poco y probá de nuevo.");
  err.esOcupado = true;
  throw err;
}

function extraerTexto(datos) {
  const cand = datos && datos.candidates && datos.candidates[0];
  if (!cand) return null;
  const partes = cand.content && cand.content.parts;
  if (!partes) return null;
  return partes.map((p) => p.text || "").join("").trim();
}

function dormir(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* ============================================================
   ANALIZAR IMAGEN
   ============================================================ */
function leerArchivoComoBase64(archivo) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const coma = dataUrl.indexOf(",");
      resolve({ base64: dataUrl.slice(coma + 1), mime: archivo.type || "image/jpeg" });
    };
    reader.onerror = reject;
    reader.readAsDataURL(archivo);
  });
}

async function procesar(archivo) {
  limpiarMensajes();
  if (!archivo) {
    aviso("warn", "Primero tomá una foto o seleccioná una imagen de la página.");
    return;
  }
  const spinner = cargando("Analizando la página...");
  try {
    const { base64, mime } = await leerArchivoComoBase64(archivo);
    const crudo = await llamarGemini(base64, mime);
    const apunte = normalizarApunte(crudo);
    estado.apunte = apunte;
    estado.respuestas = {};
    estado.entregado = false;
    estado.audio = null;
    estado.imagenGenerada = false;
    limpiarMensajes();
    render();
    $("#resultado").scrollIntoView({ behavior: "smooth" });
  } catch (e) {
    limpiarMensajes();
    if (e && e.esOcupado) {
      aviso("warn", e.message);
    } else if (String(e.message || "").includes("Falta la clave")) {
      aviso("warn", e.message);
    } else {
      aviso("error", "No se pudo analizar la página. Probá de nuevo. Detalle: " + (e.message || e));
    }
  } finally {
    if (spinner && spinner.parentNode) spinner.remove();
  }
}

function normalizarApunte(a) {
  return {
    titulo: a.titulo || "Apunte",
    materia: a.materia || "",
    resumen: a.resumen || "",
    conceptos: Array.isArray(a.conceptos) ? a.conceptos : [],
    tarjetas: Array.isArray(a.tarjetas) ? a.tarjetas : [],
    examen: Array.isArray(a.examen) ? a.examen.map((p) => ({
      enunciado: p.enunciado || "",
      opciones: Array.isArray(p.opciones) ? p.opciones : [],
      correcta: Number(p.correcta) || 0
    })) : [],
    dificultad: Math.max(1, Math.min(5, Number(a.dificultad) || 3))
  };
}

$("#btnAnalizarFoto").addEventListener("click", () => {
  procesar($("#inputCamara").files[0]);
});
$("#btnAnalizarArchivo").addEventListener("click", () => {
  procesar($("#inputArchivo").files[0]);
});

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const a = estado.apunte;
  if (!a) { resultado.innerHTML = ""; return; }

  const estrellas = "⭐".repeat(a.dificultad) + "☆".repeat(5 - a.dificultad);
  let html = "";
  html += '<section class="bloque"><h2>' + esc(a.titulo) + "</h2>";
  html += '<div class="materia">' + esc(a.materia) + "</div>";
  html += '<div class="dificultad">' + estrellas + " (" + a.dificultad + "/5)</div></section>";

  html += '<section class="bloque"><h2>Resumen</h2><p>' + esc(a.resumen) + "</p>";
  html += '<button class="plano" id="btnEscuchar">🔊 Escuchar el resumen</button>';
  html += '<audio id="audioResumen" controls class="oculto" style="width:100%;margin-top:10px"></audio></section>';

  html += '<section class="bloque"><h2>Conceptos</h2><ul class="conceptos">';
  if (!a.conceptos.length) html += "<li>Sin conceptos para mostrar.</li>";
  a.conceptos.forEach((c) => {
    html += "<li><strong>" + esc(c.termino) + ":</strong> " + esc(c.explicacion) + "</li>";
  });
  html += "</ul></section>";

  html += '<section class="bloque"><h2>Tarjetas de repaso</h2>';
  if (!a.tarjetas.length) html += "<p>Sin tarjetas.</p>";
  a.tarjetas.forEach((t) => {
    html += '<details class="tarjeta"><summary>' + esc(t.pregunta) + '</summary><div class="resp">' + esc(t.respuesta) + "</div></details>";
  });
  html += "</section>";

  html += '<section class="bloque"><h2>Examen</h2>';
  a.examen.forEach((p, i) => {
    html += '<div class="pregunta" data-preg="' + i + '">';
    html += '<p class="enunciado">' + (i + 1) + ". " + esc(p.enunciado) + "</p>";
    p.opciones.forEach((op, j) => {
      const id = "resp_" + i + "_" + j;
      const marcado = estado.respuestas[i] === j ? "checked" : "";
      const deshabilitado = estado.entregado ? "disabled" : "";
      html += '<label class="opcion"><input type="radio" name="preg_' + i + '" id="' + id + '" value="' + j + '" ' + marcado + " " + deshabilitado + ">" +
              "<span>" + letra(j) + ") " + esc(op) + "</span></label>";
    });
    if (estado.entregado) {
      const elegido = estado.respuestas[i];
      if (elegido === p.correcta) {
        html += '<div class="veredicto ok">✅ ¡Correcto!</div>';
      } else if (elegido === undefined) {
        html += '<div class="veredicto sin">⚠️ Sin respuesta. La correcta era: ' + esc(p.opciones[p.correcta]) + "</div>";
      } else {
        html += '<div class="veredicto mal">❌ Incorrecto. La correcta era: ' + esc(p.opciones[p.correcta]) + "</div>";
      }
    }
    html += "</div>";
  });

  if (!estado.entregado) {
    html += '<button id="btnEntregar">Entregar examen</button>';
  } else {
    const { aciertos, total } = calificar(a, estado.respuestas);
    html += '<div class="puntaje"><span class="num">' + aciertos + " / " + total + "</span>Puntaje</div>";
  }
  html += "</section>";

  html += '<section class="bloque"><div class="acciones">';
  html += '<button class="secundario" id="btnDescargarGuia">Descargar guía de estudio</button>';
  html += '<button class="coral" id="btnGenerarImagen">Crear infografía gratuita</button>';
  html += "</div>";
  html += '<div id="zonaImagen"></div></section>';

  resultado.innerHTML = html;

  conectarEventos();
  if (estado.entregado) {
    const { aciertos, total } = calificar(a, estado.respuestas);
    if (total > 0 && aciertos === total) lanzarConfeti();
  }
}

function conectarEventos() {
  document.querySelectorAll('input[type=radio][name^="preg_"]').forEach((radio) => {
    radio.addEventListener("change", (e) => {
      const i = Number(e.target.name.split("_")[1]);
      estado.respuestas[i] = Number(e.target.value);
    });
  });

  const btnEntregar = $("#btnEntregar");
  if (btnEntregar) btnEntregar.addEventListener("click", () => {
    estado.entregado = true;
    render();
  });

  const btnEscuchar = $("#btnEscuchar");
  if (btnEscuchar) btnEscuchar.addEventListener("click", hablarResumen);

  const btnGuia = $("#btnDescargarGuia");
  if (btnGuia) btnGuia.addEventListener("click", descargarGuia);

  const btnImagen = $("#btnGenerarImagen");
  if (btnImagen) btnImagen.addEventListener("click", mostrarInfografia);
}

/* ============================================================
   AUDIO (Web Speech API)
   ============================================================ */
function hablarResumen() {
  const a = estado.apunte;
  if (!a) return;
  if (!("speechSynthesis" in window)) {
    aviso("warn", "La voz no está disponible en este navegador.");
    return;
  }
  window.speechSynthesis.cancel();
  const texto = a.titulo + ". " + a.resumen;
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = "es-ES";
  u.rate = 1;
  window.speechSynthesis.speak(u);
}

/* ============================================================
   DESCARGAR GUÍA
   ============================================================ */
function aMarkdown(a) {
  const lineas = [];
  lineas.push("# " + a.titulo);
  lineas.push("**Materia:** " + a.materia);
  lineas.push("**Dificultad:** " + "⭐".repeat(a.dificultad) + "☆".repeat(5 - a.dificultad));
  lineas.push("");
  lineas.push("## Resumen");
  lineas.push(a.resumen);
  lineas.push("");
  lineas.push("## Conceptos");
  a.conceptos.forEach((c) => lineas.push("- **" + c.termino + ":** " + c.explicacion));
  lineas.push("");
  lineas.push("## Tarjetas de repaso");
  a.tarjetas.forEach((t, i) => {
    lineas.push((i + 1) + ". **" + t.pregunta + "**");
    lineas.push("   - " + t.respuesta);
  });
  lineas.push("");
  lineas.push("## Examen");
  a.examen.forEach((p, i) => {
    lineas.push((i + 1) + ". " + p.enunciado);
    p.opciones.forEach((op, j) => {
      lineas.push("   " + letra(j) + ") " + op + (j === p.correcta ? " **(Correcta)**" : ""));
    });
  });
  return lineas.join("\n");
}

function descargarGuia() {
  const a = estado.apunte;
  if (!a) return;
  descargar("guia_de_estudio.md", new Blob([aMarkdown(a)], { type: "text/markdown" }));
}

function descargar(nombre, blob) {
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = nombre;
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ============================================================
   INFOGRAFÍA (canvas, sin API)
   ============================================================ */
const COLORES = ["#23847D", "#E47C58", "#D5A52D", "#5278A4", "#6B936B", "#B25F76"];

function envolver(ctx, texto, anchoMax) {
  const palabras = String(texto).split(/\s+/);
  const lineas = [];
  let linea = "";
  for (const palabra of palabras) {
    const prueba = (linea + " " + palabra).trim();
    if (linea && ctx.measureText(prueba).width > anchoMax) {
      lineas.push(linea);
      linea = palabra;
    } else {
      linea = prueba;
    }
  }
  if (linea) lineas.push(linea);
  return lineas;
}

function dibujarInfografia(a, canvas) {
  const ancho = 1440, alto = 1080;
  canvas.width = ancho;
  canvas.height = alto;
  const ctx = canvas.getContext("2d");
  const fondo = "#F4F6EF", tinta = "#183B3A";

  ctx.fillStyle = fondo;
  ctx.fillRect(0, 0, ancho, alto);

  ctx.fillStyle = tinta;
  ctx.fillRect(0, 0, ancho, 228);
  ctx.fillStyle = "#93D1C4";
  ctx.font = "bold 24px Arial";
  ctx.fillText(String(a.materia).toUpperCase(), 72, 70);
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 54px Arial";
  const titulo = envolver(ctx, a.titulo, ancho - 144).slice(0, 2);
  titulo.forEach((linea, i) => ctx.fillText(linea, 72, 140 + i * 66));

  redondear(ctx, 72, 266, ancho - 144, 154, 24);
  ctx.fillStyle = "#FFFFFF";
  ctx.fill();
  redondear(ctx, 72, 266, 14, 154, 7);
  ctx.fillStyle = COLORES[0];
  ctx.fill();
  ctx.fillStyle = COLORES[0];
  ctx.font = "bold 20px Arial";
  ctx.fillText("IDEA PRINCIPAL", 112, 308);
  ctx.fillStyle = tinta;
  ctx.font = "25px Arial";
  envolver(ctx, a.resumen, ancho - 224).slice(0, 3).forEach((linea, i) => {
    ctx.fillText(linea, 112, 348 + i * 34);
  });

  ctx.fillStyle = tinta;
  ctx.font = "bold 30px Arial";
  ctx.fillText("Conceptos clave", 72, 482);

  const conceptos = a.conceptos.slice(0, 6);
  const margen = 72, espacio = 24;
  const anchoTarjeta = Math.floor((ancho - 2 * margen - espacio) / 2);
  const altoTarjeta = 166, inicioY = 510;
  if (!conceptos.length) {
    ctx.font = "24px Arial";
    ctx.fillText("Revisá el resumen para recordar las ideas principales.", 72, 528);
  }
  conceptos.forEach((c, i) => {
    const columna = i % 2, fila = Math.floor(i / 2);
    const x = margen + columna * (anchoTarjeta + espacio);
    const y = inicioY + fila * (altoTarjeta + 22);
    const color = COLORES[i % COLORES.length];
    redondear(ctx, x, y, anchoTarjeta, altoTarjeta, 20);
    ctx.fillStyle = "#FFFFFF";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#E0E6DD";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + 46, y + 46, 24, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 24px Arial";
    ctx.fillText(String(i + 1), x + 39, y + 55);
    ctx.fillStyle = tinta;
    ctx.font = "bold 23px Arial";
    envolver(ctx, c.termino, anchoTarjeta - 116).slice(0, 2).forEach((linea, k) => {
      ctx.fillText(linea, x + 88, y + 38 + k * 30);
    });
    ctx.fillStyle = "#425956";
    ctx.font = "20px Arial";
    envolver(ctx, c.explicacion, anchoTarjeta - 48).slice(0, 3).forEach((linea, k) => {
      ctx.fillText(linea, x + 24, y + 105 + k * 27);
    });
  });
}

function redondear(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function mostrarInfografia() {
  const a = estado.apunte;
  const zona = $("#zonaImagen");
  if (!a || !zona) return;
  let canvas = zona.querySelector("canvas");
  if (!canvas) {
    canvas = document.createElement("canvas");
    canvas.className = "infografia";
    zona.appendChild(canvas);
  }
  dibujarInfografia(a, canvas);
  if (!zona.querySelector("#btnDescargarImagen")) {
    const btn = document.createElement("button");
    btn.id = "btnDescargarImagen";
    btn.className = "plano";
    btn.textContent = "Descargar imagen";
    btn.style.marginTop = "10px";
    btn.addEventListener("click", () => {
      canvas.toBlob((blob) => descargar("imagen_de_referencia.png", blob), "image/png");
    });
    zona.appendChild(btn);
  }
}

/* ============================================================
   CALIFICAR Y CONFETI
   ============================================================ */
function calificar(a, respuestas) {
  let aciertos = 0;
  a.examen.forEach((p, i) => {
    if (respuestas[i] === p.correcta) aciertos++;
  });
  return { aciertos, total: a.examen.length };
}

function lanzarConfeti() {
  for (let i = 0; i < 60; i++) {
    const trozo = document.createElement("div");
    trozo.className = "confeti";
    trozo.style.left = Math.random() * 100 + "vw";
    trozo.style.background = COLORES[i % COLORES.length];
    trozo.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    document.body.appendChild(trozo);
    const anim = trozo.animate(
      [
        { transform: "translateY(0) rotate(0deg)", opacity: 1 },
        { transform: "translateY(" + (window.innerHeight + 40) + "px) rotate(" + (Math.random() * 720) + "deg)", opacity: 0.9 }
      ],
      { duration: 1800 + Math.random() * 1200, easing: "cubic-bezier(.2,.6,.4,1)" }
    );
    anim.onfinish = () => trozo.remove();
  }
}

/* ============================================================
   UTILIDADES
   ============================================================ */
function esc(texto) {
  return String(texto == null ? "" : texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
function letra(indice) { return ["a", "b", "c", "d"][indice] || "?"; }
